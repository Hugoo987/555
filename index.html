         注意：og:url 與 og:image 必須是「完整網址」，爬蟲才抓得到。

    <link rel="apple-touch-icon" href="images/thumb-logo.png">
    <style>
        :root {
            --bg-top: #fff8ef;
            --bg-bottom: #fdead3;
            --orange: #ff9f43;
            --orange-2: #ff8a2b;
            --orange-soft: #ffd9a8;
            --brown: #5c4a37;
            --brown-soft: #94806610;
            --muted: #9a8568;
            --card: #fffefb;
            --line: #f1e2c9;
            --shadow: rgba(240, 170, 95, 0.20);
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        html { scroll-behavior: smooth; }

        body {
            font-family: "PingFang TC", "Microsoft JhengHei", "Segoe UI", Arial, sans-serif;
            background: linear-gradient(180deg, var(--bg-top) 0%, #fff3e4 40%, var(--bg-bottom) 100%);
            background-attachment: fixed;
            color: var(--brown);
            min-height: 100vh;
            line-height: 1.5;
        }

        .wrap {
            max-width: 960px;
            margin: 0 auto;
            padding: 0 16px;
        }

        h1, h2, h3 { line-height: 1.25; }

        /* ---------- Header ---------- */
        header.site {
            position: sticky;
            top: 0;
            z-index: 900;
            background: rgba(255, 250, 242, 0.9);
            backdrop-filter: blur(8px);
            border-bottom: 1.5px solid var(--line);
        }

        .site-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 12px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 8px;
            font-size: 1.4rem;
            font-weight: 900;
            color: var(--brown);
        }

        .brand .thumb { font-size: 1.5rem; }
        .brand .logo-img {
            width: 34px;
            height: 34px;
            border-radius: 8px;
            object-fit: cover;
            vertical-align: middle;
        }

        /* ---------- Hero ---------- */
        .hero {
            position: relative;
            text-align: center;
            padding: 46px 16px 30px;
            overflow: hidden;
        }


        .hero-title {
            display: inline-block;
            position: relative;
            font-size: clamp(2.6rem, 9vw, 4rem);
            font-weight: 900;
            letter-spacing: 4px;
            color: #4a3a28;
            text-shadow: 2px 2px 0 #fff, 4px 4px 0 rgba(255, 160, 70, 0.25);
        }
        .hero-title::after {
            content: "";
            position: absolute;
            left: 6%; right: 6%;
            bottom: -10px;
            height: 10px;
            background: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='120' height='10' viewBox='0 0 120 10'><path d='M2 6 Q 15 0 30 6 T 60 6 T 90 6 T 118 6' stroke='%23ff9f43' stroke-width='3.5' fill='none' stroke-linecap='round'/></svg>") repeat-x center / 120px 10px;
        }

        .hero-pill {
            display: inline-block;
            margin: 26px 0 14px;
            padding: 9px 22px;
            border-radius: 999px;
            background: linear-gradient(135deg, #ffe0b0, #ffcf8f);
            color: #7a5a30;
            font-weight: 800;
            font-size: 0.98rem;
            box-shadow: 0 4px 10px var(--shadow);
        }

        /* floating doodles */
        .doodle {
            position: absolute;
            font-size: 2.2rem;
            opacity: 0.95;
            animation: float 5s ease-in-out infinite;
            user-select: none;
            pointer-events: none;
        }
        .d1 { top: 26px;  left: 6%;  font-size: 3rem; animation-delay: 0s; }
        .d2 { top: 120px; left: 3%;  font-size: 2.6rem; animation-delay: .6s; }
        .d3 { top: 30px;  right: 8%; font-size: 2.4rem; animation-delay: 1.1s; }
        .d4 { top: 150px; right: 5%; font-size: 3.2rem; animation-delay: .3s; }
        .d5 { top: 70px;  right: 26%; font-size: 1.4rem; color: var(--orange); animation-delay: 1.4s; }
        .d6 { top: 195px; left: 9%;  font-size: 2.4rem; animation-delay: .9s; }
        @keyframes float {
            0%,100% { transform: translateY(0) rotate(-3deg); }
            50%     { transform: translateY(-12px) rotate(3deg); }
        }
        /* 手機用：浮動幅度較小，避免飄向文字 */
        @keyframes floatSm {
            0%,100% { transform: translateY(0) rotate(-3deg); }
            50%     { transform: translateY(-6px) rotate(3deg); }
        }

        /* ---------- Tabs ---------- */
        .tabs {
            display: flex;
            gap: 14px;
            margin: 8px 0 22px;
        }
        .tab {
            flex: 1;
            padding: 16px 10px;
            border-radius: 16px;
            border: 2px solid var(--line);
            background: var(--card);
            color: var(--muted);
            font-size: 1.15rem;
            font-weight: 800;
            cursor: pointer;
            transition: all 0.2s;
            box-shadow: 0 4px 10px rgba(240, 170, 95, 0.08);
        }
        .tab:hover { color: var(--orange-2); }
        .tab.active {
            color: var(--orange-2);
            border-color: var(--orange);
            background: #fff;
            box-shadow: 0 8px 18px var(--shadow);
        }

        /* ---------- Update bar ---------- */
        .update-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 8px;
            padding: 12px 18px;
            border-radius: 14px;
            background: #fff6ea;
            border: 1.5px dashed var(--orange-soft);
            color: #7a6a50;
            font-weight: 700;
            font-size: 0.95rem;
            margin-bottom: 22px;
        }
        .update-bar .time { color: var(--muted); font-weight: 600; }

        /* ---------- Feature strip ---------- */
        .feature-strip {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            background: var(--card);
            border: 1.5px solid var(--line);
            border-radius: 22px;
            padding: 22px 10px;
            box-shadow: 0 10px 24px rgba(240, 175, 95, 0.14);
            margin-bottom: 30px;
        }
        .feature {
            text-align: center;
            padding: 4px 8px;
            border-right: 1.5px solid var(--line);
            cursor: pointer;
            transition: transform 0.15s;
        }
        .feature:last-child { border-right: none; }
        .feature:hover { transform: translateY(-4px); }
        .feature .ic {
            font-size: 1.9rem;
            display: block;
            margin-bottom: 8px;
        }
        .feature .t { font-weight: 800; color: var(--brown); font-size: 0.98rem; }
        .feature .s { font-size: 0.8rem; color: var(--muted); margin-top: 3px; }

        /* ---------- Section heading ---------- */
        .sec-head {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin: 6px 4px 16px;
        }
        .sec-head h2 {
            font-size: 1.35rem;
            font-weight: 900;
            color: var(--brown);
        }
        .sec-head h2 .star { color: var(--orange); }

        /* ---------- Coupon grid ---------- */
        .tab-note {
            text-align: center;
            color: var(--muted);
            font-weight: 700;
            margin: 0 0 16px;
        }

        .coupon-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 320px));
            justify-content: center;
            align-items: start;   /* 各卡維持自身高度，不被同列最高的卡撐開 */
            gap: 18px;
            margin-bottom: 28px;
        }
        /* 票券凹口：用 mask 從卡片上「挖掉」兩個半圓，讓頁面背景直接透出來。
           因此不必再寫死凹口顏色，捲到哪一段漸層都不會露餡。
           陰影必須改用 filter: drop-shadow，box-shadow 會被 mask 一起裁掉。 */
        .coupon {
            --notch: 9px;       /* 凹口半徑 */
            --notch-x: 50px;    /* 距右緣距離，對齊 .coupon-side 的虛線裁切線 */
            position: relative;
            display: flex;
            background: var(--card);
            border: 1.5px solid var(--line);
            border-radius: 22px;
            overflow: hidden;
            -webkit-mask:
                radial-gradient(circle var(--notch) at calc(100% - var(--notch-x)) 0,    transparent 98%, #000 100%),
                radial-gradient(circle var(--notch) at calc(100% - var(--notch-x)) 100%, transparent 98%, #000 100%);
            -webkit-mask-composite: source-in;
            mask:
                radial-gradient(circle var(--notch) at calc(100% - var(--notch-x)) 0,    transparent 98%, #000 100%),
                radial-gradient(circle var(--notch) at calc(100% - var(--notch-x)) 100%, transparent 98%, #000 100%);
            mask-composite: intersect;
            filter: drop-shadow(0 7px 11px rgba(240, 175, 95, 0.20));
            transition: transform 0.18s, filter 0.18s;
        }
        .coupon:hover { transform: translateY(-4px); filter: drop-shadow(0 12px 16px rgba(240, 175, 95, 0.30)); }

        .coupon-body {
            flex: 1;
            padding: 22px 18px 20px;
            text-align: center;
        }
        .coupon .kind {
            font-size: 1.02rem;
            font-weight: 800;
            color: var(--brown);
            margin-bottom: 4px;
        }
        .coupon .amount {
            font-size: 2.5rem;
            font-weight: 900;
            color: var(--orange-2);
            letter-spacing: 1px;
            line-height: 1.1;
        }
        .coupon .desc {
            color: var(--muted);
            font-size: 0.9rem;
            margin: 4px 0 14px;
        }
        .coupon .copy-btn {
            width: 100%;
            padding: 11px 0;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #f7941f, #e97606);
            color: #fff;
            font-weight: 800;
            font-size: 1rem;
            cursor: pointer;
            box-shadow: 0 5px 12px rgba(255, 150, 60, 0.35);
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
        }
        .coupon .copy-btn:hover { filter: brightness(1.05); transform: translateY(-2px); box-shadow: 0 9px 18px rgba(255, 150, 60, 0.4); }
        .coupon .copy-btn:active { transform: translateY(0); }

        /* 一張券多個代碼（超商別）時的按鈕列 */
        .code-row {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            justify-content: center;
        }
        .code-btn {
            flex: 1 1 auto;
            min-width: 96px;
            padding: 10px 12px;
            border: none;
            border-radius: 12px;
            background: linear-gradient(135deg, #f7941f, #e97606);
            color: #fff;
            font-weight: 800;
            font-size: 0.95rem;
            cursor: pointer;
            box-shadow: 0 4px 10px rgba(255, 150, 60, 0.32);
            transition: transform 0.15s, box-shadow 0.15s, filter 0.15s;
        }
        .code-btn:hover { filter: brightness(1.06); transform: translateY(-2px); box-shadow: 0 8px 16px rgba(255, 150, 60, 0.4); }
        .code-btn:active { transform: translateY(0); }

        /* 代碼很多時（5 組以上）改成兩欄，避免卡片被拉得過長 */
        .code-row.compact .code-btn {
            flex: 1 1 calc(50% - 4px);
            min-width: 0;
            padding: 9px 4px;
            font-size: 0.84rem;
        }

        /* 純裝飾的票券側條（多代碼卡片用）：剪刀貼齊裁切線 */
        .coupon-side.deco { cursor: default; color: var(--orange-soft); font-size: 1.05rem; }
        .coupon-side.deco:hover { color: var(--orange-soft); background: transparent; }

        .coupon-side {
            width: 50px;
            border-left: 2px dashed var(--orange-soft);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--muted);
            font-size: 1.2rem;
            cursor: pointer;
            transition: color 0.15s, background 0.15s;
        }
        .coupon-side:hover { color: var(--orange-2); background: #fff6ea; }

        .ribbon {
            position: absolute;
            top: 0; left: 0;
            background: linear-gradient(135deg, #ff9f43, #ff7f2b);
            color: #fff;
            font-size: 0.72rem;
            font-weight: 800;
            padding: 5px 14px 6px;
            border-radius: 22px 0 14px 0;
            z-index: 2;
            box-shadow: 0 3px 6px rgba(255, 140, 60, 0.35);
        }

        /* ---------- Community card ---------- */
        .community {
            background: var(--card);
            border: 1.5px solid var(--line);
            border-radius: 24px;
            padding: 26px 22px;
            box-shadow: 0 12px 26px rgba(240, 175, 95, 0.16);
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 20px;
            margin-bottom: 44px;
        }
        .community .intro .t { font-size: 1.25rem; font-weight: 900; color: var(--brown); }
        .community .intro .s { color: var(--muted); margin-top: 6px; font-weight: 600; }
        .social {
            display: flex;
            gap: 12px;
            flex-wrap: wrap;
        }
        .social a {
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            min-width: 130px;
            text-decoration: none;
            padding: 12px 16px;
            border-radius: 14px;
            border: 1.5px solid var(--line);
            background: #fffdf8;
            box-shadow: 0 5px 12px rgba(210, 130, 50, 0.10);
            transition: transform 0.15s, box-shadow 0.15s;
        }
        .social a:hover { transform: translateY(-3px); box-shadow: 0 10px 18px rgba(210, 130, 50, 0.18); }
        .social a .name { font-weight: 800; color: var(--brown); }
        .social a .name .badge { margin-right: 6px; }
        .social a .note { font-size: 0.78rem; color: var(--muted); margin-top: 2px; }
        .social a.line .name .badge { color: #06c755; }
        .social a.threads .name .badge { color: #111; }

        /* ---------- Footer ---------- */
        footer.site {
            border-top: 1.5px solid var(--line);
            background: rgba(255, 250, 242, 0.6);
        }
        .foot-inner {
            max-width: 960px;
            margin: 0 auto;
            padding: 20px 16px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }
        .foot-brand { display: flex; align-items: center; gap: 8px; font-weight: 900; color: var(--brown); }
        .foot-brand .tag { font-weight: 600; color: var(--muted); font-size: 0.85rem; }
        .foot-copy { color: var(--muted); font-size: 0.82rem; }

        /* ---------- Toast ---------- */
        .toast {
            position: fixed;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            background: linear-gradient(135deg, #f7941f, #e97606);
            color: #fff;
            padding: 13px 24px;
            border-radius: 16px;
            font-weight: 800;
            box-shadow: 0 8px 18px rgba(255, 160, 70, 0.4);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.35s ease;
            z-index: 9999;
        }
        .toast.show { opacity: 1; }

        /* ==================================================================
           手機版 RWD（原本散在四個地方，統一集中在這裡管理）
           ================================================================== */
        @media (max-width: 640px) {
            /* Hero */
            .hero { padding: 28px 14px 46px; }
            .hero-title { letter-spacing: 2px; }
            .hero-pill { font-size: 0.85rem; padding: 8px 16px; margin: 18px 0 12px; }

            /* 漂浮 emoji：幅度縮小並貼齊四角，避免飄到文字上 */
            .doodle { animation-name: floatSm; }
            .d1 { top: 6px; left: 3%; font-size: clamp(1.5rem, 7vw, 2rem) !important; }
            .d4 { top: 6px; right: 3%; font-size: clamp(1.5rem, 7vw, 2rem) !important; }
            .d2 { top: auto; bottom: 6px; left: 4%; font-size: clamp(1.3rem, 6vw, 1.7rem) !important; }
            .d6 { top: auto; bottom: 6px; right: 4%; font-size: clamp(1.3rem, 6vw, 1.7rem) !important; }
            .d5 { top: 34px; right: 14%; font-size: clamp(0.9rem, 4vw, 1.1rem) !important; }
            .d3 { display: none; }

            /* Tabs / 更新時間 */
            .tabs { gap: 10px; margin: 6px 0 16px; }
            .tab { padding: 13px 6px; font-size: 1rem; border-radius: 14px; }
            .update-bar { padding: 10px 14px; font-size: 0.85rem; justify-content: center; text-align: center; }

            /* 功能磚 */
            .feature-strip { padding: 18px 4px; }
            .feature { padding: 4px 3px; }
            .feature .ic { font-size: 1.6rem; margin-bottom: 5px; }
            .feature .t { font-size: 0.82rem; }
            .feature .s { font-size: 0.68rem; }

            /* 折扣券 */
            .sec-head h2 { font-size: 1.2rem; }
            .coupon .amount { font-size: 2.2rem; }

            /* 社群卡 / Footer */
            .community { flex-direction: column; align-items: stretch; text-align: center; padding: 22px 18px; margin-bottom: 32px; }
            .community .intro { text-align: center; }
            .social { justify-content: center; flex-direction: column; width: 100%; }
            .social a { align-items: center; text-align: center; width: 100%; min-width: 0; }
            .foot-inner { justify-content: center; text-align: center; gap: 4px; }
        }
    </style>
</head>

    <script>
        function showContent(sectionId) {
            document.querySelectorAll('.tab-panel').forEach(s => s.style.display = 'none');
            document.querySelectorAll('.tabs .tab').forEach(b => b.classList.remove('active'));
            document.getElementById(sectionId).style.display = 'block';
            if (sectionId === 'discounts') document.getElementById('btn-discounts').classList.add('active');
            else if (sectionId === 'march-discounts') document.getElementById('btn-march').classList.add('active');
        }

        function copyFallback(text) {
            const tempTextArea = document.createElement('textarea');
            tempTextArea.value = text;
            tempTextArea.setAttribute('readonly', '');
            tempTextArea.style.position = 'fixed';
            tempTextArea.style.opacity = '0';
            document.body.appendChild(tempTextArea);
            tempTextArea.select();
            tempTextArea.setSelectionRange(0, text.length);
            document.execCommand('copy');
            document.body.removeChild(tempTextArea);
        }

        function copyToClipboard(text) {
            let done;
            if (navigator.clipboard && navigator.clipboard.writeText) {
                done = navigator.clipboard.writeText(text).catch(() => copyFallback(text));
            } else {
                copyFallback(text);
                done = Promise.resolve();
            }

            const toast = document.getElementById('toast');
            toast.textContent = '折扣碼「' + text + '」已複製！';
            toast.classList.add('show');
            setTimeout(() => toast.classList.remove('show'), 900);
            return done;
        }

        // 開新分頁（功能磚用）：以錨點觸發，較不會被擋或開出空白分頁
        function openExternal(url) {
            const a = document.createElement('a');
            a.href = url;
            a.target = '_blank';
            a.rel = 'noopener noreferrer';
            document.body.appendChild(a);
            a.click();
            a.remove();
        }

        // 複製後在「同一個分頁」跳轉，不再開新分頁（避免產生空白分頁）
        function copyAndGo(code, url) {
            copyToClipboard(code).finally(() => {
                setTimeout(() => { window.location.href = url; }, 350);
            });
        }

        /* ==================================================================
           折扣碼資料 —— 要更新折扣碼只要改這一段，不用動 HTML
           ------------------------------------------------------------------
           每張券的欄位：
             ribbon : 左上角標籤，不需要就寫 null
             kind   : 券別（全站折價券／商城折價券…）
             amount : 大字金額（例：299-30）
             desc   : 下方小字說明
             codes  : 代碼陣列
                      只有一組  → 顯示整排「複製折扣碼」大按鈕，右側⧉可點
                      兩組以上  → 依 label 顯示一排小按鈕，右側改成裝飾剪刀
           ================================================================== */
        const STORES = {
            shopee:  { grid: 'grid-shopee',  url: 'https://s.shopee.tw/9pe8FBraHy' },
            coupang: { grid: 'grid-coupang', url: 'https://coupa.ng/cnLsCp' },
        };

        const COUPONS = {
            shopee: [
                {
                    ribbon: '隱藏版', kind: '全站折價券', amount: '100-20',
                    desc: '滿100可折20元',
                    codes: [{ code: 'SHPAF99' }],
                },
                {
                    ribbon: '9.9限定', kind: '全站折價券', amount: '1000-999',
                    desc: '滿1000可折999元・點按鈕複製代碼',
                    codes: [
                        { label: '第一組', code: '99SP830' },
                        { label: '第二組', code: '99SP829' },
                        { label: '第三組', code: '99SP908' },
                    ],
                },
                {
                    ribbon: '9.9限定', kind: '全站折價券', amount: '499-50',
                    desc: '滿499可折50元・點按鈕複製代碼',
                    codes: [
                        { label: 'SHOPEE826', code: 'SHOPEE826' },
                        { label: 'SHOPEE827', code: 'SHOPEE827' },
                        { label: 'SHOPEE828', code: 'SHOPEE828' },
                        { label: 'SHOPEE829', code: 'SHOPEE829' },
                        { label: 'SHOPEE830', code: 'SHOPEE830' },
                        { label: 'SHOPEE831', code: 'SHOPEE831' },
                        { label: 'SHOPEE901', code: 'SHOPEE901' },
                        { label: 'SHOPEE902', code: 'SHOPEE902' },
                        { label: 'SHOPEE903', code: 'SHOPEE903' },
                        { label: 'SHOPEE904', code: 'SHOPEE904' },
                        { label: 'SHOPEE905', code: 'SHOPEE905' },
                        { label: 'SHOPEE906', code: 'SHOPEE906' },
                        { label: 'SHOPEE907', code: 'SHOPEE907' },
                    ],
                },
                {
                    ribbon: '超取限定', kind: '全站折價券', amount: '299-30',
                    desc: '滿299可折30元・點超商複製代碼',
                    codes: [
                        { label: '7-11取貨', code: 'SVSP2609' },
                        { label: '全家取貨', code: 'FMSP2609' },

                },
                {
                    ribbon: '超取限定', kind: '商城折價券', amount: '299-30',
                    desc: '滿299可折30元・點超商複製代碼',
                    codes: [

            ],
            coupang: [
                {
                    ribbon: '隱藏版', kind: '全站折價券', amount: '500-80',
                    desc: '滿500可折80元',
                    codes: [{ code: 'Y26JULY80' }],
                },
            ],
        };

        // ---------- 依資料產生券卡 ----------
        function el(tag, className, text) {
            const node = document.createElement(tag);
            if (className) node.className = className;
            if (text != null) node.textContent = text;
            return node;
        }

        function buildCoupon(item, storeUrl) {
            const card = el('div', 'coupon');
            if (item.ribbon) card.appendChild(el('span', 'ribbon', item.ribbon));

            const body = el('div', 'coupon-body');
            body.appendChild(el('div', 'kind', item.kind));
            body.appendChild(el('div', 'amount', item.amount));
            body.appendChild(el('div', 'desc', item.desc));

            const single = item.codes.length === 1;
            if (single) {
                const btn = el('button', 'copy-btn', '複製折扣碼');
                btn.addEventListener('click', () => copyAndGo(item.codes[0].code, storeUrl));
                body.appendChild(btn);
            } else {
                const row = el('div', 'code-row' + (item.codes.length >= 5 ? ' compact' : ''));
                item.codes.forEach(c => {
                    const btn = el('button', 'code-btn', c.label);
                    btn.addEventListener('click', () => copyAndGo(c.code, storeUrl));
                    row.appendChild(btn);
                });
                body.appendChild(row);
            }
            card.appendChild(body);

            // 側條：單一代碼＝可點的複製鈕；多代碼＝純裝飾剪刀
            let side;
            if (single) {
                side = el('div', 'coupon-side', '⧉');
                side.title = '複製折扣碼';
                side.setAttribute('role', 'button');
                side.setAttribute('aria-label', '複製折扣碼');
                side.addEventListener('click', () => copyAndGo(item.codes[0].code, storeUrl));
            } else {
                side = el('div', 'coupon-side deco', '✂');
                side.setAttribute('aria-hidden', 'true');
            }
            card.appendChild(side);

            return card;
        }

        function renderCoupons() {
            Object.entries(STORES).forEach(([store, cfg]) => {
                const grid = document.getElementById(cfg.grid);
                if (!grid) return;
                grid.replaceChildren(
                    ...(COUPONS[store] || []).map(item => buildCoupon(item, cfg.url))
                );
            });
        }

        renderCoupons();
    </script>
